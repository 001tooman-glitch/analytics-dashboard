<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аналитическая панель</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
    padding:30px;
}

h1{
    margin-bottom:25px;
}

.card{
    background:white;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    padding:20px;
    margin-bottom:20px;
}

.kpi-container{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.kpi{
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    width:250px;
}

.kpi-title{
    font-size:18px;
    margin-bottom:10px;
}

.kpi-value{
    font-size:36px;
    font-weight:bold;
    color:#0d6efd;
}

.bar{
    background:#0d6efd;
    color:white;
    padding:8px;
    margin:10px 0;
    border-radius:6px;
    white-space:nowrap;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#0d6efd;
    color:white;
}

th,td{
    border:1px solid #ddd;
    padding:12px;
    text-align:left;
}

tr:nth-child(even){
    background:#f8f8f8;
}
</style>

</head>
<body>

<h1>📊 Аналитическая панель</h1>

<div class="card">
    <h3>Загрузка CSV-файла</h3>
    <input type="file" id="csvFile" accept=".csv">
</div>

<div class="kpi-container">

    <div class="kpi">
        <div class="kpi-title">Общий объем продаж</div>
        <div class="kpi-value" id="totalSales">0</div>
    </div>

    <div class="kpi">
        <div class="kpi-title">Количество записей</div>
        <div class="kpi-value" id="records">0</div>
    </div>

</div>

<div class="card">
    <h2>Диаграмма продаж</h2>
    <div id="chart"></div>
</div>

<div class="card">
    <h2>Данные</h2>
    <div id="tableContainer">
        <table>
            <thead>
                <tr>
                    <th>Месяц</th>
                    <th>Продажи</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>

document.getElementById('csvFile')
.addEventListener('change', function(event){

    const file = event.target.files[0];

    if(!file){
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){

        const text = e.target.result
            .replace(/\r/g,'')
            .trim();

        const rows = text.split('\n');

        let totalSales = 0;
        let recordCount = 0;
        let maxSales = 0;

        const data = [];

        for(let i = 1; i < rows.length; i++){

            const line = rows[i].trim();

            if(!line){
                continue;
            }

            const cols = line.split(';');

            if(cols.length < 2){
                continue;
            }

            const month = cols[0].trim();

            const sales = Number(
                cols[1].trim()
            );

            if(isNaN(sales)){
                continue;
            }

            data.push({
                month,
                sales
            });

            totalSales += sales;
            recordCount++;

            if(sales > maxSales){
                maxSales = sales;
            }
        }

        document.getElementById('totalSales')
            .innerText =
            totalSales.toLocaleString('ru-RU');

        document.getElementById('records')
            .innerText =
            recordCount;

        let chartHtml = '';

        data.forEach(item => {

            const percent =
                (item.sales / maxSales) * 100;

            chartHtml += `
                <div
                    class="bar"
                    style="width:${percent}%">
                    ${item.month}
                    :
                    ${item.sales.toLocaleString('ru-RU')}
                </div>
            `;
        });

        document.getElementById('chart')
            .innerHTML = chartHtml;

        let tableHtml = `
        <table>
            <thead>
                <tr>
                    <th>Месяц</th>
                    <th>Продажи</th>
                </tr>
            </thead>
            <tbody>
        `;

        data.forEach(item => {

            tableHtml += `
            <tr>
                <td>${item.month}</td>
                <td>
                    ${item.sales.toLocaleString('ru-RU')}
                </td>
            </tr>
            `;
        });

        tableHtml += `
            </tbody>
        </table>
        `;

        document.getElementById(
            'tableContainer'
        ).innerHTML = tableHtml;
    };

    reader.readAsText(file,'UTF-8');

});

</script>

</body>
</html>
