<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Аналитическая панель</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    padding:20px;
}

.card{
    background:white;
    border-radius:10px;
    padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    margin-bottom:20px;
}

.kpi-container{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.kpi{
    background:white;
    padding:20px;
    border-radius:10px;
    width:220px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.kpi-value{
    font-size:32px;
    color:#0d6efd;
    font-weight:bold;
}

.bar{
    background:#0d6efd;
    color:white;
    padding:8px;
    margin:8px 0;
    border-radius:5px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th{
    background:#0d6efd;
    color:white;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
}
</style>
</head>
<body>

<h1>📊 Аналитическая панель</h1>

<div class="card">
    <input type="file" id="csvFile" accept=".csv">
</div>

<div class="kpi-container">

    <div class="kpi">
        <div>Общий объем продаж</div>
        <div class="kpi-value" id="totalSales">0</div>
    </div>

    <div class="kpi">
        <div>Количество записей</div>
        <div class="kpi-value" id="records">0</div>
    </div>

</div>

<div class="card">
    <h2>Диаграмма продаж</h2>
    <div id="chart"></div>
</div>

<div class="card">
    <h2>Данные</h2>
    <div id="tableContainer"></div>
</div>

<script>

document.getElementById('csvFile').addEventListener('change', function(e){

    const file = e.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(evt){

        const text = evt.target.result.trim();

        const rows = text.split('\n');

        let html = `
        <table>
        <tr>
            <th>Месяц</th>
            <th>Продажи</th>
        </tr>
        `;

        let chartHtml = "";

        let total = 0;
        let maxValue = 0;

        const data=[];

        for(let i=1;i<rows.length;i++){

            const cols = rows[i].split(',');

            if(cols.length<2) continue;

            const month = cols[0].trim();
            const sales = parseInt(cols[1]);

            data.push({month,sales});

            total += sales;

            if(sales > maxValue){
                maxValue = sales;
            }

            html += `
            <tr>
                <td>${month}</td>
                <td>${sales.toLocaleString()}</td>
            </tr>
            `;
        }

        html += "</table>";

        data.forEach(item => {

            const width =
                (item.sales / maxValue) * 100;

            chartHtml += `
            <div class="bar"
                 style="width:${width}%">
                 ${item.month} :
                 ${item.sales.toLocaleString()}
            </div>`;
        });

        document.getElementById(
            "tableContainer"
        ).innerHTML = html;

        document.getElementById(
            "chart"
        ).innerHTML = chartHtml;

        document.getElementById(
            "totalSales"
        ).innerText =
            total.toLocaleString();

        document.getElementById(
            "records"
        ).innerText =
            data.length;
    };

    reader.readAsText(file);

});

</script>
</body>
</html>
